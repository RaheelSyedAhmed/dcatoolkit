name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check release tag matches package version
        run: |
          pkg_version="v$(uv version --short)"
          tag_name="${{ github.event.release.tag_name }}"
          if [ "$pkg_version" != "$tag_name" ]; then
            echo "Release tag ($tag_name) does not match pyproject.toml version ($pkg_version)."
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic
