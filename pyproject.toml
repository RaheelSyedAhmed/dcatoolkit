[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dcatoolkit"
version = "0.4.0"
description = "Collection of useful modules and representations for managing DCA output data."
keywords = ["dca", "toolkit", "DI", "coevolution"]

readme = "README.md"
license = {file = "LICENSE"}

requires-python = ">=3.12"

authors = [
  {name = "Raheel Syed Ahmed", email = "raheelsyedahmed@gmail.com"}
]
maintainers = [
  {name = "Raheel Syed Ahmed", email = "raheelsyedahmed@gmail.com"}
]

dependencies = [
  "biotite>=1.7",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scipy>=1.11.0",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/RaheelSyedAhmed/dcatoolkit"
Changelog = "https://github.com/RaheelSyedAhmed/dcatoolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/RaheelSyedAhmed/dcatoolkit/issues"

[project.optional-dependencies]
tests = [
  "pytest",
]
docs = [
  "sphinx",
  "pdoc",
  "numpydoc"
]
lint = [
  "ruff",
]
plot = [
    "matplotlib>=3.10.9",
]
[tool.ruff]
# The target Python version is inferred from requires-python above.
# Lint the package and its tests; examples are standalone scripts.
extend-exclude = [
  "examples",
  # Python 2 scripts that generated the reference contact files in tests/pdb_info; not valid Python 3.
  "tests/pdb_info/interface_contacts_allatom_args.py",
  "tests/pdb_info/interface_contacts_calpha_args.py",
]

[tool.ruff.lint]
# Explicit rule selection, so results don't change with ruff's defaults between versions.
select = [
  "E4", "E7", "E9",  # pycodestyle errors: imports, statements, syntax
  "F",               # Pyflakes: unused imports/variables, undefined names
  "B",               # flake8-bugbear: likely bugs
  "I",               # isort: import ordering
  "UP",              # pyupgrade: modern syntax for the target Python version
  "C4",              # flake8-comprehensions
  "SIM",             # flake8-simplify
  "PIE",             # flake8-pie: unnecessary code
  "RUF",             # Ruff-specific rules
]
ignore = [
  "B905",  # zip() without strict=: most zips are equal-length by construction, and ResidueAlignment deliberately truncates mismatched align texts.
]
