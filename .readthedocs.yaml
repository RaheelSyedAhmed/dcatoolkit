# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    # Install dcatoolkit and the "docs" dependency group from pyproject.toml / uv.lock.
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/source/conf.py
  # Treat warnings as errors, the same as building locally with -W --keep-going.
  fail_on_warning: true
